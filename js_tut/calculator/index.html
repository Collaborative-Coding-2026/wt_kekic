<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>randomnumbergenerator</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div id = "calculator">
        <input id = "display" readonly>
        <div id="keys">
            <!--Row 1-->
            <button on click="appendToDisplay('back')"> ⌫ </button>
            <button on click="appendToDisplay('c')"> C </button>
            <button on click="appendToDisplay('%')"> % </button>
            <button on click="appendToDisplay('/')"> / </button>
            <br>

            <!--Row 2-->
            <button on click="appendToDisplay('7')"> 7 </button>
            <button on click="appendToDisplay('8')"> 8 </button>
            <button on click="appendToDisplay('9')"> 9 </button>
            <button on click = "appendToDisplay('x')"> X </button>
            <br>

            <!--Row 3-->
            <button on click="appendToDisplay('4')"> 4 </button>
            <button on click="appendToDisplay('5')"> 5 </button>
            <button on click="appendToDisplay('6')"> 6 </button>
            <button on click="appendToDisplay('+')"> - </button>

            <br>
            <!--Row 4-->
            <button on click="appendToDisplay('4')"> 1 </button>
            <button on click="appendToDisplay('5')"> 2 </button>
            <button on click="appendToDisplay('6')"> 3 </button>
            <button on click="appendToDisplay('+')"> + </button>
            <br>

            <!--Row 5-->
            <button on click="appendToDisplay('sign')"> +/- </button>
            <button on click="appendToDisplay('5')"> 0 </button>
            <button on click="appendToDisplay('6')"> . </button>
            <button on click="appendToDisplay('+')"> = </button>
        </div>
    </div>
</body>
</html>
